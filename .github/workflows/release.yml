name: release

on:
  push:
    tags:
      - '**'

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ajalt/mordant' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # disable configuration cache due to https://github.com/gradle/gradle/issues/22779
      - run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
  docs:
    needs: publish
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract the changelog entries for the tagged version
        run: |
          awk -v ver="$GITHUB_REF_NAME" '$0 == "## " ver {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > release_notes.md
          test -s release_notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
